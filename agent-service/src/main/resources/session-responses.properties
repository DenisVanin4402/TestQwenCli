# Локальные шаблоны ответа POC. Для каждого TurnOutcome обязателен message; вид результата закреплён в коде renderer.
# Шаблон операции получает строковые аргументы в порядке её схемы; preparationNo не показывается.
# Вид ответа относится к представлению; Action не выбирает шаблон или текст.
CONFIRMATION_REQUIRED.message={0}
status.proposal=Запросить статус платежа №{0}?
PREPARATION_CANCELLED.message=Подготовка отменена. Можно выбрать новое действие.
NO_ACTIVE_PREPARATION.message=Активной подготовки нет. Выберите действие.
REQUEST_SUBMITTED.message=Запрос «{0}» передан на обработку. Обращение завершено.
SESSION_COMPLETED.message=Обращение уже завершено. Для нового запроса начните новую сессию.
INVALID_COMMAND.message=Сейчас это действие недоступно. Сначала подготовьте запрос и отдельно подтвердите его.
error.SESSION_BUSY=Сессия обрабатывает другое сообщение.
error.CONTEXT_MISMATCH=Исходные данные платежа в этой сессии изменять нельзя.
error.INVALID_REQUEST=Для первого обращения нужны организация, пользователь и все реквизиты платежа.
error.INVALID_COMMAND=Сначала выберите запрос статуса, затем отдельно подтвердите подготовку.
error.DEFAULT=Не удалось завершить обращение. Внешняя операция могла выполниться; автоматического повтора нет.
text.clarification=Не удалось понять, какое действие вы хотите выполнить. Пожалуйста, уточните запрос ещё раз. Например: «Узнай статус платежа».
error.TEXT_ANALYSIS_FAILED=Не удалось обработать сообщение. Попробуйте позже или выберите действие кнопкой.

error.INVALID_CONFIRMATION=Состав или формат подтверждения неверен.
error.STALE_PREPARATION=Подтверждение относится к другой подготовке.
error.CONFIRMATION_MISMATCH=Подтверждённые данные отличаются от предложения.
